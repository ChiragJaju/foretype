name: CI

# Required checks: Repo checks, Lint, Type-check, Unit tests. The last three are rollups over the
# site and app jobs, which run only when their paths change (always on main). Tests that need the
# Accessibility permission live in the XcodeGen UI-test target and run locally, never here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A PR's newer push supersedes the older run; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      site: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 the base, so the diff is exactly the PR.
      - id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "app=true"; echo "site=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          touches() { if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "app=$(touches '^(app/|\.swiftlint\.yml$|\.swift-format$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "site=$(touches '^(site/|scripts/activity\.mjs$|\.oxfmtrc\.json$|package(-lock)?\.json$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secret scan
        run: gitleaks git --redact --no-banner .

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Repo checks
        run: node scripts/verify.mjs --tier repo

  site-lint:
    name: Site lint
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: site

      - name: oxlint
        working-directory: site
        run: npm run lint

      - name: oxfmt
        run: npx --no-install oxfmt --check site/src scripts

  site-build:
    name: Site type-check and build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          # activity.mjs reads the git history.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: |
          node ../scripts/activity.mjs
          npm run build

  app-lint:
    name: App lint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint version
          swift --version

      - name: SwiftLint
        run: swiftlint lint --strict --quiet

      - name: swift-format
        run: swift format lint --strict --recursive app/Sources app/Tests app/E2E app/Package.swift

  app-build:
    name: App build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: app/.build
          key: spm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build every target
        run: swift build

  app-test:
    name: App unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: app/.build
          key: spm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Every SwiftPM test target: none needs the Accessibility permission or a model download.
      - name: Unit tests
        run: app/scripts/test.sh

  # Rollups: branch protection needs fixed names. Skipped jobs pass; failed or cancelled ones fail.
  lint:
    name: Lint
    if: always()
    needs: [changes, site-lint, app-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  type-check:
    name: Type-check
    if: always()
    needs: [changes, site-build, app-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  unit-tests:
    name: Unit tests
    if: always()
    needs: [changes, app-test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed jobs: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
