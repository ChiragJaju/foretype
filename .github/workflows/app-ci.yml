name: App CI

# macOS minutes bill at 10x on a private repo, so this runs only when app code changes, cancels
# superseded runs, and tests only Core and the test-support fakes. Everything that needs the
# Accessibility permission (end-to-end UI tests) runs locally, never here.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    # A grep, so it runs on the cheap Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: app/scripts/privacy-check.sh

  core:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: app/.build
          key: spm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build Core and test support
        run: swift build --target ForetypeTestSupport

      - name: Test Core and test support
        run: swift test --filter 'ForetypeCoreTests|ForetypeTestSupportTests'
